<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Rust DOCX · Ejemplo de integración</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
    header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; background: #fff; border-bottom: 1px solid #e2e8f0; }
    header h1 { font-size: 1rem; margin: 0 auto 0 0; }
    docx-editor { height: calc(100vh - 58px); }
    button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <!-- The whole integration: one element, one optional toolbar, a few API calls -->
  <header>
    <h1>&lt;docx-editor&gt; embebido</h1>
    <docx-toolbar for="doc"></docx-toolbar>
    <button id="fill">Rellenar variables</button>
    <button id="save">Descargar</button>
  </header>
  <docx-editor id="doc" sample locale="es"></docx-editor>

  <script type="module">
    import '@dimarborda/docx-editor';
    import '@dimarborda/docx-editor/fonts';
    import '@dimarborda/docx-editor/style.css';

    const doc = document.getElementById('doc');
    doc.whenReady().then(editor => {
      document.getElementById('fill').onclick = () => editor.replaceVariables({
        CIUDAD: 'Bogotá', NOMBRE_CLIENTE: 'Acme S.A.S.', NOMBRE_PROVEEDOR: 'Estudio Norte',
      });
      document.getElementById('save').onclick = () => editor.download();
      doc.addEventListener('change', () => console.log('variables pendientes:', editor.variables()));
    });
  </script>
</body>
</html>
