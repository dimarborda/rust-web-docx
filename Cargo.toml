[package]
name = "rust-web-docx"
version = "0.1.0"
edition = "2021"
description = "Word (.docx) editor that runs in the browser: Rust + WebAssembly layout engine rendered to canvas"
repository = "https://github.com/dimarborda/rust-web-docx"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
quick-xml = { version = "0.42", features = ["serialize"] }
base64 = "0.22"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true
