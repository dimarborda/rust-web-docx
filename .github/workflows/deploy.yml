# Tests and audits the dependencies, builds the Rust → WebAssembly engine and the Vite app,
# then publishes it to Cloudflare
# (Workers static assets, configured in wrangler.toml). Needs two repository secrets:
# CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Rust tests
        run: cargo test

      # Known vulnerabilities in the Rust dependencies (RustSec advisory database) stop the deploy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # High or critical advisories in the editor package's runtime dependencies stop the deploy
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high -w packages/docx-editor

      - name: Build (wasm-pack + Vite)
        run: npm run build

      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          # wrangler 4 applies apps/demo/public/_headers (CSP, caching); the action's default
          # 3.x uploads it as a plain file
          wranglerVersion: "4.86.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
